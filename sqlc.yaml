version: "2"

sql:
    - engine: "postgresql"
      queries: "db/postgres/queries/"
      schema: "db/postgres/migrations/"

      gen:
          go:
              package: "db"
              out: "db/postgres/sqlc"

              sql_package: "pgx/v5"

              emit_json_tags: true
              emit_interface: true
              emit_empty_slices: true
              emit_pointers_for_null_types: true

              overrides:
                  - db_type: "uuid"
                    nullable: false
                    go_type:
                        import: "github.com/google/uuid"
                        type: "UUID"

                  - db_type: "uuid"
                    nullable: true
                    go_type:
                        import: "github.com/google/uuid"
                        type: "UUID"
                        pointer: true

                  - db_type: "text"
                    nullable: true
                    go_type:
                        type: "string"
                        pointer: true

                  - db_type: "jsonb"
                    go_type:
                        import: "encoding/json"
                        type: "RawMessage"

                  - db_type: "jsonb"
                    nullable: true
                    go_type:
                        import: "encoding/json"
                        type: "RawMessage"

                  - db_type: "timestamptz"
                    nullable: false
                    go_type:
                        import: "time"
                        type: "Time"

                  - db_type: "timestamptz"
                    nullable: true
                    go_type:
                        import: "time"
                        type: "Time"
                        pointer: true

                  - db_type: "uuid"
                    go_type:
                        import: "github.com/google/uuid"
                        type: "UUID"

                  - db_type: "uuid"
                    nullable: true
                    go_type:
                        import: "github.com/google/uuid"
                        type: "UUID"
                        pointer: true
